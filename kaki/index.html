<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Drive League - Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030308;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 1000px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.15);
            border-radius: 16px;
            overflow: hidden;
        }
        canvas {
            background: #06060c;
            display: block;
            border: 2px solid #00ffcc;
            border-radius: 16px;
        }
        
        .menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10,10,25,0.98) 0%, rgba(3,3,8,0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 2.5rem;
            color: #fff;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6), 0 0 30px rgba(255, 0, 119, 0.6);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Lekerekített Cyberpunk Gombok */
        button {
            background: rgba(0, 255, 204, 0.05);
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 16px 50px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 30px; /* Teljesen lekerekített szélek */
            width: 320px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }

        button:hover {
            background: #00ffcc;
            color: #030308;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            transform: scale(1.02);
        }

        button.btn-pvp {
            border-color: #ff0077;
            color: #ff0077;
            background: rgba(255, 0, 119, 0.05);
            box-shadow: 0 0 10px rgba(255, 0, 119, 0.1);
        }

        button.btn-pvp:hover {
            background: #ff0077;
            color: #030308;
            box-shadow: 0 0 25px rgba(255, 0, 119, 0.6);
        }

        .controls-info {
            margin-top: 2.5rem;
            color: #8888aa;
            font-family: monospace;
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.6;
            background: rgba(15, 15, 30, 0.6);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .controls-info strong { color: #fff; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="mainMenu" class="menu-overlay">
        <h1>Cyber Drive</h1>
        <div class="button-container">
            <button onclick="startGame(1)">1 PLAYER (VS AI)</button>
            <button class="btn-pvp" onclick="startGame(2)">2 PLAYERS</button>
        </div>
        <div class="controls-info">
            <strong>P1 (Cyan):</strong> WASD | <span style="color:#00ffcc">SPACE = Boost</span> | <span style="color:#00ffcc">SHIFT = Drift</span><br>
            <strong>P2 (Magenta):</strong> Nyilak | <span style="color:#ff0077">ENTER = Boost</span> | <span style="color:#ff0077">CTRL = Drift</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="1000" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mainMenu = document.getElementById('mainMenu');

let gameState = 'menu'; // menu, countdown, playing, goal, gameover
let gameMode = 1;
let score = { p1: 0, p2: 0 };
let gameTimer = 60; // 1 perces meccs
let timerInterval;

// Visszaszámláló és gól infók változói
let countdownValue = 3;
let countdownTimer;
let lastScorer = "";

// Stabilabb billentyűzetkezelő (Megakadályozza a beragadást)
const keys = {};
window.addEventListener('keydown', e => {
    let k = e.key;
    if (k === ' ') { e.preventDefault(); k = 'space'; }
    if (k === 'Control') { e.preventDefault(); k = 'control'; }
    if (k === 'Shift') { k = 'shift'; }
    keys[k.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
    let k = e.key;
    if (k === ' ') k = 'space';
    if (k === 'Control') k = 'control';
    if (k === 'Shift') k = 'shift';
    keys[k.toLowerCase()] = false;
});

class Car {
    constructor(x, y, color, isAI = false) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.isAI = isAI;
        this.angle = 0;
        
        this.vx = 0;
        this.vy = 0;
        this.speed = 0;
        this.maxSpeed = 4.5;
        this.accel = 0.15;
        this.drag = 0.96;
        
        this.radius = 18;
        this.boostEnergy = 100;
        this.isBoosting = false;
        this.isDrifting = false;
    }

    update(targetBall) {
        if (gameState !== 'playing') {
            this.vx *= 0.9; this.vy *= 0.9; this.speed = 0;
            return;
        }

        if (this.isAI) {
            this.handleAI(targetBall);
        } else {
            this.handleInputs();
        }

        // Kiváló tapadás-vesztéses Drift mechanika
        let grip = this.isDrifting ? 0.03 : 0.24;
        
        let targetVx = Math.cos(this.angle) * this.speed;
        let targetVy = Math.sin(this.angle) * this.speed;

        this.vx += (targetVx - this.vx) * grip;
        this.vy += (targetVy - this.vy) * grip;

        this.x += this.vx;
        this.y += this.vy;

        this.speed *= this.drag;

        if (!this.isBoosting && this.boostEnergy < 100) {
            this.boostEnergy += 0.3;
        }

        // Falak
        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
    }

    handleInputs() {
        if (this.color === '#00ffcc') { // P1 (WASD + Space + Shift)
            this.isDrifting = keys['shift'];
            this.isBoosting = keys['space'] && this.boostEnergy > 5;

            let turnSpeed = this.isDrifting ? 0.075 : 0.048;
            if (keys['a']) this.angle -= turnSpeed;
            if (keys['d']) this.angle += turnSpeed;
            
            if (keys['w']) this.speed += this.accel;
            if (keys['s']) this.speed -= this.accel * 0.6;

            if (this.isBoosting) {
                this.speed += this.accel * 2.5;
                if(this.speed > this.maxSpeed * 1.8) this.speed = this.maxSpeed * 1.8;
                this.boostEnergy -= 1.5;
            } else {
                if (this.speed > this.maxSpeed) this.speed *= 0.93;
            }
        } else { // P2 (Nyilak + Enter + Ctrl)
            this.isDrifting = keys['control'];
            this.isBoosting = keys['enter'] && this.boostEnergy > 5;

            let turnSpeed = this.isDrifting ? 0.075 : 0.048;
            if (keys['arrowleft']) this.angle -= turnSpeed;
            if (keys['arrowright']) this.angle += turnSpeed;
            
            if (keys['arrowup']) this.speed += this.accel;
            if (keys['arrowdown']) this.speed -= this.accel * 0.6;

            if (this.isBoosting) {
                this.speed += this.accel * 2.5;
                if(this.speed > this.maxSpeed * 1.8) this.speed = this.maxSpeed * 1.8;
                this.boostEnergy -= 1.5;
            } else {
                if (this.speed > this.maxSpeed) this.speed *= 0.93;
            }
        }
    }

    handleAI(ball) {
        let dx = ball.x - this.x;
        let dy = ball.y - this.y;
        let targetAngle = Math.atan2(dy, dx);
        
        let angleDiff = targetAngle - this.angle;
        angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
        
        this.isDrifting = Math.abs(angleDiff) > 1.1;
        this.angle += angleDiff * 0.06;

        if (Math.abs(angleDiff) < 0.4) {
            this.speed += this.accel;
            let dist = Math.sqrt(dx*dx + dy*dy);
            this.isBoosting = dist > 200 && this.boostEnergy > 30;
            if (this.isBoosting) {
                this.speed += this.accel * 1.6;
                this.boostEnergy -= 1.0;
            }
        } else {
            this.speed += this.accel * 0.4;
            this.isBoosting = false;
        }

        if (!this.isBoosting && this.speed > this.maxSpeed) this.speed = this.maxSpeed;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.strokeRect(-18, -12, 36, 24);

        ctx.fillStyle = '#fff';
        ctx.fillRect(14, -9, 4, 3);
        ctx.fillRect(14, 6, 4, 3);

        if (this.isBoosting) {
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.moveTo(-18, -8); ctx.lineTo(-35, 0); ctx.lineTo(-18, 8); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
    }
}

class Ball {
    constructor(x, y) {
        this.reset(x, y);
        this.radius = 22;
        this.friction = 0.988;
    }

    reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
    }

    update() {
        if (gameState !== 'playing') return;

        this.x += this.vx;
        this.y += this.vy;
        this.vx *= this.friction;
        this.vy *= this.friction;

        if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }
        if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -1; }

        // Gól és fal logikák
        if (this.x - this.radius < 0) {
            if (this.y > 200 && this.y < 400) {
                score.p2++;
                triggerGoal("MAGENTA SCORED");
            } else { this.x = this.radius; this.vx *= -1; }
        }
        if (this.x + this.radius > canvas.width) {
            if (this.y > 200 && this.y < 400) {
                score.p1++;
                triggerGoal("CYAN SCORED");
            } else { this.x = canvas.width - this.radius; this.vx *= -1; }
        }
    }

    draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#fff';
        ctx.stroke();
        ctx.restore();
    }
}

let p1, p2, ball;

function startGame(mode) {
    gameMode = mode;
    mainMenu.style.display = 'none';
    score = { p1: 0, p2: 0 };
    gameTimer = 60;
    
    p1 = new Car(0, 0, '#00ffcc', false);
    p2 = new Car(0, 0, '#ff0077', (gameMode === 1));
    ball = new Ball(0, 0);

    setRandomSpawnSpots();
    startCountdown();
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameState === 'playing') {
            gameTimer--;
            if (gameTimer <= 0) {
                gameTimer = 0;
                gameState = 'gameover';
                clearInterval(timerInterval);
                setTimeout(() => { mainMenu.style.display = 'flex'; }, 3000);
            }
        }
    }, 1000);

    requestAnimationFrame(gameLoop);
}

// Véletlenszerű kezdőpozíciók (Közép, Oldalsó/Átlós, Támadó-Védő szpotok)
function setRandomSpawnSpots() {
    const setupType = Math.floor(Math.random() * 3); // 0, 1, vagy 2

    ball.reset(canvas.width / 2, canvas.height / 2);

    if (setupType === 0) {
        // 1. Klasszikus Középső felállás
        p1.x = 180; p1.y = canvas.height / 2; p1.angle = 0;
        p2.x = canvas.width - 180; p2.y = canvas.height / 2; p2.angle = Math.PI;
    } else if (setupType === 1) {
        // 2. Oldalsó / Átlós felállás
        p1.x = 200; p1.y = 120; p1.angle = Math.PI / 4;
        p2.x = canvas.width - 200; p2.y = canvas.height - 120; p2.angle = -Math.PI * 0.75;
    } else {
        // 3. Aszimmetrikus / Védekezőbb felállás
        p1.x = 220; p1.y = canvas.height - 150; p1.angle = -Math.PI / 6;
        p2.x = canvas.width - 220; p2.y = 150; p2.angle = Math.PI * 0.83;
    }
    p1.vx = 0; p1.vy = 0; p1.speed = 0;
    p2.vx = 0; p2.vy = 0; p2.speed = 0;
}

function startCountdown() {
    gameState = 'countdown';
    countdownValue = 3;
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
        countdownValue--;
        if (countdownValue <= 0) {
            clearInterval(countdownTimer);
            gameState = 'playing';
        }
    }, 800);
}

function triggerGoal(scorerText) {
    gameState = 'goal';
    lastScorer = scorerText;
    setTimeout(() => {
        setRandomSpawnSpots();
        startCountdown();
    }, 2000);
}

function checkCollision(car, ballObj) {
    let dx = ballObj.x - car.x;
    let dy = ballObj.y - car.y;
    let distance = Math.sqrt(dx * dx + dy * dy);
    let minDist = car.radius + ballObj.radius;

    if (distance < minDist) {
        let overlap = minDist - distance;
        let nx = dx / distance;
        let ny = dy / distance;

        ballObj.x += nx * overlap;
        ballObj.y += ny * overlap;

        let impulseX = car.vx * 1.4;
        let impulseY = car.vy * 1.4;

        ballObj.vx = nx * (Math.abs(impulseX) + 2.5) * 1.2;
        ballObj.vy = ny * (Math.abs(impulseY) + 2.5) * 1.2;
    }
}

function drawHUD() {
    // Eszméletlen letisztult lekerekített felső kijelző (Kapszula forma)
    let hudX = canvas.width / 2;
    ctx.save();
    ctx.fillStyle = "rgba(10, 10, 20, 0.85)";
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 2;
    
    // Lekerekített háttér téglalap az eredménynek
    ctx.beginPath();
    ctx.roundRect(hudX - 140, 15, 280, 50, 25);
    ctx.fill();
    ctx.stroke();

    // Időmérő és Eredmény kiírása
    ctx.font = "bold 24px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = "#00ffcc";
    ctx.fillText(score.p1, hudX - 90, 48);
    
    ctx.fillStyle = "#ff0077";
    ctx.fillText(score.p2, hudX + 90, 48);

    // Formázott idő (mm:ss)
    ctx.fillStyle = "#fff";
    let secs = gameTimer % 60;
    let timeText = `0:${secs < 10 ? '0' : ''}${secs}`;
    ctx.fillText(timeText, hudX, 48);
    ctx.restore();

    // Lekerekített Neon Boost csíkok az alsó sarkokban
    ctx.save();
    ctx.lineWidth = 2;
    // P1
    ctx.fillStyle = "rgba(0, 255, 204, 0.1)";
    ctx.beginPath(); ctx.roundRect(40, canvas.height - 30, 160, 12, 6); ctx.fill();
    ctx.fillStyle = "#00ffcc";
    ctx.beginPath(); ctx.roundRect(40, canvas.height - 30, (p1.boostEnergy / 100) * 160, 12, 6); ctx.fill();
    
    // P2
    ctx.fillStyle = "rgba(255, 0, 119, 0.1)";
    ctx.beginPath(); ctx.roundRect(canvas.width - 200, canvas.height - 30, 160, 12, 6); ctx.fill();
    ctx.fillStyle = "#ff0077";
    ctx.beginPath(); ctx.roundRect(canvas.width - 200, canvas.height - 30, (p2.boostEnergy / 100) * 160, 12, 6); ctx.fill();
    ctx.restore();
}

function drawOverlays() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (gameState === 'goal') {
        ctx.font = "bold 50px sans-serif";
        ctx.fillStyle = lastScorer.includes("CYAN") ? "#00ffcc" : "#ff0077";
        ctx.shadowBlur = 20;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillText(lastScorer, canvas.width / 2, canvas.height / 2);
    } 
    else if (gameState === 'countdown') {
        ctx.font = "bold 80px monospace";
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 30;
        ctx.shadowColor = "#00ffcc";
        ctx.fillText(countdownValue, canvas.width / 2, canvas.height / 2);
    } 
    else if (gameState === 'gameover') {
        ctx.font = "bold 60px sans-serif";
        ctx.shadowBlur = 25;
        let winnerText = "DRAW MATCH";
        ctx.fillStyle = "#fff";
        if(score.p1 > score.p2) { winnerText = "CYAN WINS!"; ctx.fillStyle = "#00ffcc"; }
        if(score.p2 > score.p1) { winnerText = "MAGENTA WINS!"; ctx.fillStyle = "#ff0077"; }
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2 - 30);
        
        ctx.font = "20px monospace";
        ctx.fillStyle = "#888";
        ctx.shadowBlur = 0;
        ctx.fillText("Returning to main menu...", canvas.width / 2, canvas.height / 2 + 40);
    }
    ctx.restore();
}

function drawField() {
    ctx.strokeStyle = 'rgba(0, 255, 204, 0.02)';
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 50) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let j = 0; j < canvas.height; j += 50) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 100, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();

    ctx.lineWidth = 4;
    ctx.shadowBlur = 15;
    ctx.strokeStyle = '#00ffcc'; ctx.shadowColor = '#00ffcc';
    ctx.strokeRect(-15, 200, 20, 200);
    ctx.strokeStyle = '#ff0077'; ctx.shadowColor = '#ff0077';
    ctx.strokeRect(canvas.width - 5, 200, 20, 200);
    ctx.shadowBlur = 0;
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    p1.update();
    p2.update(ball);
    ball.update();

    if (gameState === 'playing') {
        checkCollision(p1, ball);
        checkCollision(p2, ball);
    }

    drawField();
    p1.draw();
    p2.draw();
    ball.draw();
    drawHUD();
    drawOverlays();

    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
