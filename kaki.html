<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Mini FIXED</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:#0f172a;
}

canvas{
    display:block;
    background:#14532d;
}

/* MENU */
#menu{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#0b1220;
    color:white;
}

button{
    padding:15px 30px;
    margin:10px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

/* UI */
#ui{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:32px;
    font-weight:bold;
}

#timer{
    position:absolute;
    top:55px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:20px;
}

#winner{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#000000cc;
    color:white;
    font-size:40px;
}
</style>
</head>
<body>

<div id="menu">
    <h1>ROCKET MINI</h1>
    <button onclick="start('1p')">1 Player (AI)</button>
    <button onclick="start('2p')">2 Player</button>
</div>

<div id="ui"></div>
<div id="timer"></div>

<div id="winner">
    <div id="winnerText"></div>
    <button onclick="location.reload()">Vissza</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let mode="menu";

let blue=0, red=0;
let time=180;
let overtime=false;

const keys={};
document.addEventListener("keydown",e=>keys[e.code.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.code.toLowerCase()]=false);

const goalH=220;

const p1={x:300,y:300,angle:0,speed:0,color:"#3b82f6"};
const p2={x:900,y:300,angle:Math.PI,speed:0,color:"#ef4444"};

const ball={x:600,y:300,r:25,vx:8,vy:6};

function start(m){
    mode=m;
    document.getElementById("menu").style.display="none";
    reset();
    setInterval(timer,1000);
    loop();
}

function reset(){

    blue=0;
    red=0;
    time=180;
    overtime=false;

    p1.x=300;p1.y=300;p1.angle=0;p1.speed=0;
    p2.x=900;p2.y=300;p2.angle=Math.PI;p2.speed=0;

    ball.x=600;
    ball.y=300;
}

function timer(){

    if(mode==="menu")return;

    if(!overtime) time--;

    let m=Math.floor(time/60);
    let s=time%60;

    document.getElementById("timer").innerHTML=`${m}:${s<10?"0":""}${s}`;

    if(time<=0){
        if(blue===red){
            overtime=true;
            document.getElementById("timer").innerHTML="OVERTIME (first goal wins)";
        }else{
            end();
        }
    }
}

function end(){

    mode="menu";

    let text = blue>red ? "🔵 BLUE WIN" : "🔴 RED WIN";

    document.getElementById("winnerText").innerHTML=text;
    document.getElementById("winner").style.display="flex";
}

/* MOVEMENT */
function move(c,f,b,l,r,d){

    let acc=0.25;
    let max=keys[d]?14:9;

    if(keys[f])c.speed+=acc;
    if(keys[b])c.speed-=acc;

    c.speed*=0.98;

    if(c.speed>max)c.speed=max;
    if(c.speed<-max)c.speed=-max;

    let turn=keys[d]?0.11:0.05;

    if(keys[l])c.angle-=turn;
    if(keys[r])c.angle+=turn;

    c.x+=Math.cos(c.angle)*c.speed;
    c.y+=Math.sin(c.angle)*c.speed;

    if(c.x<40)c.x=40;
    if(c.x>canvas.width-40)c.x=canvas.width-40;
    if(c.y<40)c.y=40;
    if(c.y>canvas.height-40)c.y=canvas.height-40;
}

/* AI */
function ai(){

    if(mode!=="1p")return;

    p2.angle=Math.atan2(ball.y-p2.y,ball.x-p2.x);
    p2.speed=7;
}

/* HIT */
function hit(c){

    let dx=ball.x-c.x;
    let dy=ball.y-c.y;

    let d=Math.hypot(dx,dy);

    if(d<ball.r+35){

        let a=Math.atan2(dy,dx);

        ball.vx=Math.cos(a)*(18+Math.abs(c.speed)*2);
        ball.vy=Math.sin(a)*(18+Math.abs(c.speed)*2);
    }
}

/* BALL */
function ballUpdate(){

    ball.x+=ball.vx;
    ball.y+=ball.vy;

    ball.vx*=0.995;
    ball.vy*=0.995;

    // fal
    if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1;}
    if(ball.y>canvas.height-ball.r){ball.y=canvas.height-ball.r;ball.vy*=-1;}

    checkGoal();

    hit(p1);
    hit(p2);
}

/* 🔥 FIXED GOAL SYSTEM */
function checkGoal(){

    let top = canvas.height/2 - goalH/2;
    let bottom = canvas.height/2 + goalH/2;

    // LEFT
    if(ball.x - ball.r < 0){
        if(ball.y > top && ball.y < bottom){
            red++;
            goal();
        }else{
            ball.x = ball.r;
            ball.vx *= -1;
        }
    }

    // RIGHT
    if(ball.x + ball.r > canvas.width){
        if(ball.y > top && ball.y < bottom){
            blue++;
            goal();
        }else{
            ball.x = canvas.width - ball.r;
            ball.vx *= -1;
        }
    }
}

function goal(){

    if(overtime){
        end();
        return;
    }

    ball.x=600;
    ball.y=300;
    ball.vx=(Math.random()-0.5)*12;
    ball.vy=(Math.random()-0.5)*12;

    p1.x=300;p2.x=900;
    p1.y=300;p2.y=300;
}

/* DRAW */
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#14532d";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle="white";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(canvas.width/2,0);
    ctx.lineTo(canvas.width/2,canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(canvas.width/2,canvas.height/2,100,0,Math.PI*2);
    ctx.stroke();

    ctx.fillStyle="#2563eb";
    ctx.fillRect(0,canvas.height/2-goalH/2,20,goalH);

    ctx.fillStyle="#dc2626";
    ctx.fillRect(canvas.width-20,canvas.height/2-goalH/2,20,goalH);

    drawCar(p1);
    drawCar(p2);

    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fill();

    document.getElementById("ui").innerHTML=`🔵 ${blue} : ${red} 🔴`;
}

/* CAR */
function drawCar(c){

    ctx.save();
    ctx.translate(c.x,c.y);
    ctx.rotate(c.angle);

    ctx.fillStyle=c.color;
    ctx.fillRect(-30,-18,60,36);

    ctx.fillStyle="#93c5fd";
    ctx.fillRect(-10,-10,20,20);

    // direction
    ctx.fillStyle="yellow";
    ctx.beginPath();
    ctx.moveTo(40,0);
    ctx.lineTo(20,-10);
    ctx.lineTo(20,10);
    ctx.fill();

    // wheels
    ctx.fillStyle="black";
    ctx.fillRect(-28,-22,10,8);
    ctx.fillRect(18,-22,10,8);
    ctx.fillRect(-28,14,10,8);
    ctx.fillRect(18,14,10,8);

    ctx.restore();
}

/* LOOP */
function loop(){

    if(mode==="menu")return;

    if(mode==="1p")ai();

    move(p1,"keyw","keys","keya","keyd","shiftleft");
    move(p2,"arrowup","arrowdown","arrowleft","arrowright","numpad0");

    ballUpdate();

    draw();

    requestAnimationFrame(loop);
}
</script>

</body>
</html>
